# Unit tests and lint on every pull request and push to main. Tests that need the real map data
# (~/develop/Curveon-data) or the local relay (~/develop/curveon-relay) skip themselves here; run
# them on the PC before a release (CLAUDE.md, "Tests").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: >
          ./gradlew --stacktrace
          :routing:test :protocol:test :groups:test :pmtiles:test
          :phone:testDebugUnitTest :companion:testDebugUnitTest :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --stacktrace :app:lintDebug
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
